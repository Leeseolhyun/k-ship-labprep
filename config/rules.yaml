# =====================================================================
# 법령 · 선급규칙 → 최적화 제약조건 파라미터 매핑 테이블
# ---------------------------------------------------------------------
# 설계 원칙:
#   LLM 이 법령 원문을 "해석"해서 스케줄을 만드는 구조가 아니라,
#   법령 조항을 사람이 검토해 정량 파라미터로 1회 환산해 두고,
#   최적화 엔진은 이 파라미터만 하드 제약으로 소비한다.
#   → 근거 추적 가능(trace)하고, 판정 결과가 재현된다.
#
# 각 항목 스키마:
#   id / source(출처) / clause(조항) / summary(요지)
#   param(엔진이 읽는 키) / value / applies_to(적용 대상) / hard(하드 제약 여부)
# =====================================================================

rules:
  - id: LAW-WORK-001
    source: 근로기준법
    clause: 제50조
    summary: 1일 근로시간은 휴게시간을 제외하고 8시간을 초과할 수 없다.
    param: shift_hours
    value: 8
    applies_to: all_workers
    hard: true

  - id: LAW-WORK-002
    source: 근로기준법
    clause: 제53조
    summary: 당사자 간 합의 시 1주 12시간 한도로 연장근로가 가능하다.
    param: max_overtime_hours_per_day
    value: 4
    applies_to: all_workers
    hard: true

  - id: LAW-SAFE-001
    source: 산업안전보건기준에 관한 규칙
    clause: 제618조 이하 (밀폐공간)
    summary: 밀폐공간 작업은 감시인 배치 및 연속작업 시간 제한이 요구된다.
    param: confined_space_max_continuous_min
    value: 120
    applies_to: 밀폐공간_블록
    hard: true

  - id: LAW-SAFE-002
    source: 산업안전보건기준에 관한 규칙
    clause: 제38조 (사전조사 및 작업계획서)
    summary: 중량물 취급 작업은 작업계획서에 따른 인원 배치가 필요하다.
    param: min_crew_heavy_lift
    value: 2
    applies_to: weight_ton_over_20
    hard: true

  - id: CLASS-WELD-001
    source: 한국선급(KR) 선급 및 강선규칙
    clause: 제2편 용접
    summary: 주요 구조부 용접은 해당 자세·재질에 대한 자격을 보유한 용접사가 시공한다.
    param: require_certified_welder
    value: true
    applies_to: difficulty_over_1_15
    hard: true

  - id: CLASS-WELD-002
    source: 한국선급(KR) 선급 및 강선규칙
    clause: 제2편 용접 (검사)
    summary: 고난도 블록은 유자격 검사 대응을 위해 고급 기능인력 최소 1인 포함이 필요하다.
    param: min_senior_worker_high_difficulty
    value: 1
    applies_to: difficulty_over_1_15
    hard: true

  - id: YARD-SPACE-001
    source: 사내 조립장 운영기준 (가정)
    clause: 조립장 배치기준
    summary: 동일 조립장 구역 내 동시 진입 블록은 물리적 한계로 3개를 초과할 수 없다.
    param: zone_capacity
    value: 3
    applies_to: all_zones
    hard: true

  - id: YARD-CRANE-001
    source: 사내 조립장 운영기준 (가정)
    clause: 크레인 운용기준
    summary: 구역당 겐트리 크레인 1기 운용으로 동시 중량물 반전 작업은 1건으로 제한한다.
    param: zone_crane_capacity
    value: 1
    applies_to: all_zones
    hard: false
